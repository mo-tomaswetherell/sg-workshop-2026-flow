static:
  - orog
  - lsm

targets:
  pr:
    transforms:
      - name: sqrt
      - name: clip_outputs
        min: 0.0
      - name: minmax
        out_min: -1.0
        out_max: 1.0

pos_emb: True

source:
  type: gaussian
  mean: 0.0
  std: 1.0

scheduler:
  type: condot

training:
  date_ranges:
    - ["1995-01-01", "2014-12-31"]
    - ["2080-01-01", "2099-12-31"]
  learning_rate: 1.0e-4
  epochs: 3 # typically 500; reduced for the demo
  batch_size: 16
  gradient_accumulation_steps: 8
  patience: 50
  ema_decay: 0.999

validation:
  date_ranges:
    - ["2040-01-01", "2049-12-31"]

test:
  date_ranges:
    - ["2050-01-01", "2050-12-31"] # typically ["2050-01-01", "2059-12-31"], reduced for the demo


model:
  img_resolution: 128
  model_channels: 64
  channel_mult: [1, 2, 3, 4]
  channel_mult_emb: 2
  num_residual_blocks: 2
  attention_resolutions: [16]
  dropout: 0.1
